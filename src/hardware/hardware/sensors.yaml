imu_0:
  # Xsens MTi-200 VRU: roll/pitch are gravity-referenced (~0.2 deg), yaw is
  # unreferenced/drifting so trust it less. The old 1.0 rad^2 (~57 deg std)
  # made the EKF nearly ignore the IMU -> attitude converged over many seconds.
  rotation_covariance:
    - [0.001, 0.0,   0.0]
    - [0.0,   0.001, 0.0]
    - [0.0,   0.0,   0.05]
  angular_covariance:
    - [0.01, 0.0, 0.0]
    - [0.0, 0.01, 0.0]
    - [0.0, 0.0, 0.01]
  # Accel noise density on the MTi-200 is far below this, but 0.45 m/s^2 std
  # deliberately budgets for thruster vibration + gravity-removal residual
  # (attitude error leaks ~g*err into the body-frame accel). Isotropic, so it
  # is unchanged by the R_sensor_to_base rotation.
  accel_covariance:
    - [0.2, 0.0, 0.0]
    - [0.0, 0.2, 0.0]
    - [0.0, 0.0, 0.2]
  sensor_pos_in_base: #x, y, z on (base) robot frame
  # 3x3 rotation matrix: sensor frame → base (robot) frame.
  # This is the SINGLE mounting knob (imu.py applies one remount rotation from it).
  # Gravity lands on base +Z / heading on yaw; the remaining freedom is which way
  # is FORWARD (a rotation about base-Z), which is set from the physical axis test.
  R_sensor_to_base:
    - [0, 0, -1]
    - [-1, 0, 0]
    - [0, 1, 0]
  # Now for sensor info, 0 if none, 123 depending on what it has
  position: 0
  rotation: 123
  velocity: 0
  # angular enabled: ekf.yaml fuses /angular (twist1) but this flag kept the
  # topic from ever publishing, so the EKF ran with no gyro at all.
  angular: 123
  accel: 123

# Bosch BNO085 IMUs read via the Arduino (hardware/nodes/bno085.py).
# Covariances copied from imu_0 as starting points -- retune once real data
# is plotted. The BNO085 rotation vector IS magnetometer-referenced, so yaw
# may deserve more trust than the Xsens VRU's drifting yaw; keep 0.05 until
# verified in the enclosure (magnetic distortion from thrusters/ESCs likely).
bno085_0:
  rotation_covariance:
    - [0.001, 0.0,   0.0]
    - [0.0,   0.001, 0.0]
    - [0.0,   0.0,   0.05]
  angular_covariance:
    - [0.01, 0.0, 0.0]
    - [0.0, 0.01, 0.0]
    - [0.0, 0.0, 0.01]
  accel_covariance:
    - [0.2, 0.0, 0.0]
    - [0.0, 0.2, 0.0]
    - [0.0, 0.0, 0.2]
  sensor_pos_in_base:
  # TODO(mounting): identity placeholder. Set from the physical mount once
  # installed (gravity must land on base +Z; see imu_0 comment above).
  R_sensor_to_base:
    - [1, 0, 0]
    - [0, 1, 0]
    - [0, 0, 1]
  position: 0
  rotation: 123
  velocity: 0
  angular: 123
  accel: 123

bno085_1:
  rotation_covariance:
    - [0.001, 0.0,   0.0]
    - [0.0,   0.001, 0.0]
    - [0.0,   0.0,   0.05]
  angular_covariance:
    - [0.01, 0.0, 0.0]
    - [0.0, 0.01, 0.0]
    - [0.0, 0.0, 0.01]
  accel_covariance:
    - [0.2, 0.0, 0.0]
    - [0.0, 0.2, 0.0]
    - [0.0, 0.0, 0.2]
  sensor_pos_in_base:
  # TODO(mounting): identity placeholder, same note as bno085_0.
  R_sensor_to_base:
    - [1, 0, 0]
    - [0, 1, 0]
    - [0, 0, 1]
  position: 0
  rotation: 123
  velocity: 0
  angular: 123
  accel: 123

dvl_0:
  # 12.5 cm behind base_link center, ~3 cm below it (FLU: back = -x,
  # down = -z). Enables the omega x r lever-arm correction in dvl.py.
  sensor_pos_in_base: [-0.125, 0.0, -0.03]
  # 3x3 rotation matrix: sensor frame → base (robot) frame
  R_sensor_to_base:
    - [-0.70710678,  0.70710678, 0]
    - [-0.70710678, -0.70710678, 0]
    - [ 0,           0,          1]
  # Fallback velocity covariance (used when DVL does not report a velocity error).
  velocity_covariance:
    - [0.01, 0.0,  0.0 ]
    - [0.0,  0.01, 0.0 ]
    - [0.0,  0.0,  0.01]
  # Position covariance for altitude only (position: 3 → z-axis only).
  # Only the [2][2] (z diagonal) entry is read; x/y rows are ignored by the code
  # (the published 6x6 covariance already sets those to 1e9). Large values here
  # make the intent explicit: DVL does not measure x/y position.
  position_covariance:
    - [1.0e9, 0.0,   0.0  ]
    - [0.0,   1.0e9, 0.0  ]
    - [0.0,   0.0,   0.01 ]
  position: 0
  rotation: 0
  velocity: 123
  angular: 0
  accel: 0

depth_0:
  position_covariance:
    - [1.0e9, 0.0,   0.0  ]
    - [0.0,   1.0e9, 0.0  ]
    - [0.0,   0.0,   0.001 ]
  position: 3
  rotation: 0
  velocity: 0
  angular: 0
  accel: 0