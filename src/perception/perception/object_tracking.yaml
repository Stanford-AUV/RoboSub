# Object tracking params (object_world_localizer). Per-subsystem yaml, same
# pattern as hardware/sensors.yaml and control/pid.yaml.
/object_world_localizer:
  ros__parameters:
    object_id: "gate"          # class name in the YOLO model - SET BEFORE RUN
    min_score: 0.5
    # Forward cam mount in base_link: translation (m) and RPY (deg).
    # MEASURE AND SET before the water test; identity = camera at base
    # origin looking straight forward.
    cam_translation: [0.0, 0.0, 0.0]
    cam_rpy_deg: [0.0, 0.0, 0.0]
    filter_window: 5
    filter_alpha: 0.3
    max_jump_m: 3.0
    stale_sec: 2.0
