# Object tracking params (object_world_localizer). Per-subsystem yaml, same
# pattern as hardware/sensors.yaml and control/pid.yaml.
/object_world_localizer:
  ros__parameters:
    object_id: "gate"          # class name in the YOLO model - SET BEFORE RUN
    min_score: 0.5
    # Forward cam mount in base_link: translation (m) and RPY (deg).
    # MEASURE AND SET before the water test; identity = camera at base
    # origin looking straight forward.
    cam_translation: [0.0, 0.0, 0.0]
    cam_rpy_deg: [0.0, 0.0, 0.0]
    filter_window: 5
    filter_alpha: 0.3
    max_jump_m: 3.0
    stale_sec: 2.0
    # Lock-on gate: need confirm_hits detections inside a sliding
    # confirm_window_sec that agree within max(lock_radius_min_m,
    # lock_radius_frac * range) before a goal is published to planning.
    # Tuned on 07/14 wet_data replay: detections arrive ~4.3 Hz, so 10/1.0s
    # could never lock; 5/2.0s locked only on real props, zero caustics locks.
    # If live detections3d rate is >10 Hz, consider 10/2.0s for a harder gate.
    confirm_hits: 5
    confirm_window_sec: 2.0
    lock_radius_min_m: 0.05
    lock_radius_frac: 0.03

# Classical-CV ring fallback (nodes/circle_localizer.py). Publishes
# detections3d with class "circle"; to make planning pursue it, set
# object_id above to "circle" and use object_id: circle in the run yaml's
# go_to_object item.
/circle_localizer:
  ros__parameters:
    camera_key: "oak_0"
    object_id: "circle"
    circle_diameter_m: 0.30   # physical ring diameter - MEASURE AND SET
    publish_all: false        # best ring only ("localize to one of them")
    min_radius_px: 18
    max_radius_px: 400
    min_axis_ratio: 0.45
    max_fit_residual: 0.045
    min_contrast: 4.0
