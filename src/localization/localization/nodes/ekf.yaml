ekf_filter_node:
  ros__parameters:
    publish_tf: true
    publish_acceleration: true
    world_frame: "odom"
    odom_frame: "odom"
    base_link_frame: "base_link"
    frequency: 50.0
    sensor_timeout: 0.2
    print_diagnostics: true
    
    # ----------------------------------------------------
    # POSE 0: DEPTH SENSOR
    # Fusing Z Position ONLY.
    # ----------------------------------------------------
    pose0: "/position"
    pose0_config: [false, false, true,    # x_pos, y_pos, z_pos
                  false, false, false,    # roll, pitch, yaw
                  false, false, false,    # x_vel, y_vel, z_vel
                  false, false, false,    # roll_vel, pitch_vel, yaw_vel
                  false, false, false]    # x_accel, y_accel, z_accel
    pose0_differential: false
    pose0_relative: false
    pose0_rejection_threshold: 5.0        # Drops massive depth spikes

    # ----------------------------------------------------
    # POSE 1: IMU ORIENTATION
    # Fusing Absolute Roll, Pitch, Yaw.
    # Differential is FALSE so it doesn't lose track of North/Forward.
    # ----------------------------------------------------
    pose1: "/rotation"
    pose1_config: [false, false, false,   # x_pos, y_pos, z_pos
                  true, true, true,       # roll, pitch, yaw
                  false, false, false,    # x_vel, y_vel, z_vel
                  false, false, false,    # roll_vel, pitch_vel, yaw_vel
                  false, false, false]    # x_accel, y_accel, z_accel
    pose1_differential: false             # <--- CHANGED TO FALSE
    pose1_relative: false
    pose1_queue_size: 50
    pose1_rejection_threshold: 5.0

    # ----------------------------------------------------
    # TWIST 0: DVL VELOCITY
    # TEMPORARILY DISABLED for bench testing without the DVL.
    # All config fields false => sensor is ignored, but the twist0 entry
    # MUST stay: robot_localization stops scanning at the first missing
    # twistN index, so deleting this would also drop twist1 (IMU gyro).
    # To re-enable the DVL: set the x_vel,y_vel,z_vel row back to: true, true, true
    # ----------------------------------------------------
    twist0: "/velocity"
    twist0_config: [false, false, false,  # x_pos, y_pos, z_pos
                  false, false, false,    # roll, pitch, yaw
                  false, false, false,    # x_vel, y_vel, z_vel  <-- DVL DISABLED (was true, true, true)
                  false, false, false,    # roll_vel, pitch_vel, yaw_vel
                  false, false, false]    # x_accel, y_accel, z_accel
    twist0_differential: false
    twist0_relative: false
    twist0_rejection_threshold: 5.0

    # ----------------------------------------------------
    # TWIST 1: IMU ANGULAR VELOCITY
    # Fusing Roll, Pitch, Yaw velocities.
    # ----------------------------------------------------
    twist1: "/angular"
    twist1_config: [false, false, false,  # x_pos, y_pos, z_pos
                  false, false, false,    # roll, pitch, yaw
                  false, false, false,    # x_vel, y_vel, z_vel
                  true, true, true,       # roll_vel, pitch_vel, yaw_vel
                  false, false, false]    # x_accel, y_accel, z_accel
    twist1_differential: false
    twist1_relative: false
    twist1_queue_size: 50
    twist1_rejection_threshold: 5.0

    # ----------------------------------------------------
    # IMU 0: LINEAR ACCELERATION
    # DISABLED ENTIRELY to prevent double-integration explosion
    # ----------------------------------------------------
    imu0: "/accel"
    imu0_config: [false, false, false,    # x_pos, y_pos, z_pos
                  false, false, false,    # roll, pitch, yaw
                  false, false, false,    # x_vel, y_vel, z_vel
                  false, false, false,    # roll_vel, pitch_vel, yaw_vel
                  false, false, false]    # <--- CHANGED TO FALSE
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: true