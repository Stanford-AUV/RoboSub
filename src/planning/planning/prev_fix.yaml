segment_0:
  waypoints:
    - position: {x: 0.0, y: 0.0, z: -0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 0.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    # - position: {x: 0.0, y: 0.0, z: -1.75}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    # - position: {x: 1.5, y: -0.05, z: -2.5}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    - position: {x: 3.3, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    - position: {x: 3.4, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 3.35, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 60.0}  
    - position: {x: 3.3, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 120.0}
    - position: {x: 3.25, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 3.3, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 240.0}
    - position: {x: 3.35, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 300.0}

  # Spin twice

    - position: {x: 3.4, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 3.35, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 60.0}  
    - position: {x: 3.3, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 120.0}
    - position: {x: 3.25, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 3.3, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 240.0}
    - position: {x: 3.35, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 300.0}
    - position: {x: 3.4, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    # Start zigzag
    - position: {x: 4.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 4.5, y: 0.5, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 5.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      
    # - position: {x: 13.0, y: -1.0, z: -2.5}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    # - position: {x: 13.0, y: 1.0, z: -2.5}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 1.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 0.1, y: 0.0, z: -0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
  concurrent_action: None
  exit_on_reach: True

