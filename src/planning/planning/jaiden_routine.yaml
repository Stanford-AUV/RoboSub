segment_0:
  waypoints:
  ### COIN FLIP ####
    - position: {x: 0.0, y: 0.0, z: -0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free}  # submerge without fighting yaw
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free}
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    ### GO FORWARD ###
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    # roll: x-axis, pitch: y-axis, yaw: z-axis

    ### SPIN Z-AXIS ###

    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 120.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 240.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 360.0}

    ### SPIN X-AXIS ###

    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 120.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 240.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 360.0, pitch: 0.0, yaw: 0.0}

    ### SPIN Y-AXIS ###

    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 120.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 240.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 360.0, yaw: 0.0}

    ### GO BACK WHILE SPINNING ###

    - position: {x: 10.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 7.5, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 90.0}
    - position: {x: 5.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 2.5, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 270.0}
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 360.0}

    ### GO UP ###
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 0.0, y: 0.0, z: 0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

