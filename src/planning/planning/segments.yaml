# Segmented straight run: descend, then forward in 1 m hops to x = 5 m,
# station-keeping (pause: seconds) at the end of every hop before the next
# leg starts. path_generator splits the path into a new leg at every
# waypoint carrying a `pause:` key, so the sub truly stops and holds there.
segment_0:
  waypoints:
    - position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 0.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      pause: 6.0

    - position: {x: 1.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      pause: 6.0
    - position: {x: 2.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      pause: 6.0
    # - position: {x: 3.0, y: 0.0, z: -0.6}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    #   pause: 6.0
    # - position: {x: 4.0, y: 0.0, z: -0.6}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    #   pause: 6.0
    # - position: {x: 5.0, y: 0.0, z: -0.6}
    #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      # pause: 6.0
    - position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

# Both branches should start and end at the same point for consistency.
# `code` is the value the decision topic must report to select that option.
segment_1:
  type: branch
  decision: /pinger
  waypoints_0:
    code: front
    waypoints:
      - position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      - position: {x: 2.0, y: 1.0, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 3.0
        publish: /torpedo_left
      - position: {x: 2.0, y: 1.2, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 3.0
        publish: /torpedo_right
      - position: {x: 1.0, y: 0.0, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
  waypoints_1:
    code: back
    waypoints:
      - position: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      - position: {x: 2.0, y: -1.0, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 3.0
        publish: /torpedo_right
      - position: {x: 2.0, y: -1.2, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 3.0
        publish: /torpedo_left
      - position: {x: 1.0, y: 0.0, z: -0.6}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

segment_2:
  waypoints:
    - position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 0.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      pause: 6.0

