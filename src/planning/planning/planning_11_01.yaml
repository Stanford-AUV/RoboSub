the_only_segment:
  waypoints:
  ### COIN FLIP ####
    - position: {x: 0.0, y: 0.0, z: -0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free}  # submerge without fighting yaw
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free} #yaw = rotation around the z - axis #roll = x - axis #pitch = y - axis
    - position: {x: 0.0, y: 0.0, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

  ### GO THROUGH GATE WITH "STYLE" ###
    - position: {x: 4.0, y: -0.75, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

    ## start spin 1 ##
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 120.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 240.0}

    ## start spin 2
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 120.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 240.0}
    - position: {x: 6.344, y: -0.702, z: -1.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      pause: 5.0

