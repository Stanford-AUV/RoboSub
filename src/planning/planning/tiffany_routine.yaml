segment_0:
  waypoints: 
  #submerging down into the pool 
    - position: {x: 0.0, y: 0.0, z: -0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free}  # submerge without fighting yaw
    - position: {x: 0.0, y: 0.0, z: -2}
      orientation: {roll: 0.0, pitch: 0.0, yaw: free}
    - position: {x: 0.0, y: 0.0, z: -3}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
   

  #going 10m forward
    - position: {x: 5.0, y: 0.0, z: -3}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    - position: {x: 10.0, y: 0.0, z: -3}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

  # draw triangle

    - position: {x: 10.0, y: 1.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 11.0, y: 1.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 11.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    
    #come back 
    - position: {x: 5.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 0.0, y: 0.0, z: -0.6}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 180.0}
    - position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
  concurrent_action: None
  exit_on_reach: True

