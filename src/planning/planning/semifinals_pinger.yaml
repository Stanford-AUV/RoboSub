segment_1:
  type: branch
  decision: /pinger
  waypoints_0:
    code: front
    waypoints:
    ## OCTAGON FIRST
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
        pause: 3.0
      - position: {x: 17.167, y: 1.482, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -45.0}
      - position: {x: 18.828, y: 0, z: -0.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -45.0}
        pause: 6.0
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      - position: {x: 17.167, y: 1.30, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    ## TORPEDO SECOND
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      # settle 2 s, then SHOOT LEFT (publish fires after the pause)
      - position: {x: 16.281, y: 3.807, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
        publish: /torpedo_left
      # wait 2 s after the left shot
      - position: {x: 16.281, y: 3.807, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
      # rise 20 cm (closer to the surface), settle 2 s, then SHOOT RIGHT
      - position: {x: 16.281, y: 3.807, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
        publish: /torpedo_right
      # wait 2 s after the right shot (servo re-centers during this hold)
      - position: {x: 16.281, y: 3.807, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}

  waypoints_1:
    code: back
    waypoints:
    ## TORPEDO FIRST
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      # settle 2 s, then SHOOT LEFT (publish fires after the pause)
      - position: {x: 16.281, y: 3.807, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
        publish: /torpedo_left
      # wait 2 s after the left shot
      - position: {x: 16.281, y: 3.807, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
      # rise 20 cm (closer to the surface), settle 2 s, then SHOOT RIGHT
      - position: {x: 16.281, y: 3.807, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
        publish: /torpedo_right
      # wait 2 s after the right shot (servo re-centers during this hold)
      - position: {x: 16.281, y: 3.807, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
        pause: 2.0
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
    ## OCTAGON SECOND
      - position: {x: 17.167, y: 1.482, z: -0.8}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -45.0}
      - position: {x: 18.828, y: 0, z: -0.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -45.0}
        pause: 6.0
      - position: {x: 18.828, y: 0, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      - position: {x: 17.167, y: 1.30, z: -0.7}
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
      - position: {x: 16.161, y: 2.248, z: -1.0}
        orientation: {roll: 0.0, pitch: 0.0, yaw: -33.352}
