name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sim-humble.Dockerfile
          tags: robosub-sim-humble
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and test
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws robosub-sim-humble \
            bash -c "colcon build --merge-install --symlink-install --base-paths . && ./test.sh"
      